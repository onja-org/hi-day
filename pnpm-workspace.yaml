packages:
  - "frontend"
  - "backend"
  - "desktop"
allowBuilds:
  '@paymoapp/active-window': true
  argon2: true
  better-sqlite3: true
  electron: true
  # Pulled in transitively by electron-builder 26's app-builder-lib. Only the
  # `squirrel` Windows target uses it and we ship `nsis`, so its postinstall
  # (which downloads the Squirrel.Windows toolchain) is dead weight here.
  electron-winstaller: false
  uiohook-napi: true
  unrs-resolver: true
  # dbus-next's optional native dep, used only for ABSTRACT unix sockets.
  # The accessibility bus this app talks to is addressed by real path
  # (unix:path=/run/user/<uid>/at-spi/bus), so dbus-next's pure-JS socket
  # path handles it and this never loads — left unbuilt rather than adding
  # a node-gyp compile to every install for a code path we don't use.
  usocket: false
minimumReleaseAgeExclude:
  - '@next/env@16.3.2'
  - '@next/eslint-plugin-next@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - eslint-config-next@16.3.2
  - next@16.3.2
