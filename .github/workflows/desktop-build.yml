name: Desktop build

on:
  workflow_dispatch: {}
  push:
    # Cut a release by tagging e.g. `desktop-v0.2.0` (matching
    # desktop/package.json's version) and pushing the tag — that's the
    # only thing that also runs the publish job below. A plain manual
    # dispatch just builds + tests, useful for checking a branch builds
    # cleanly on all three platforms without cutting a release.
    tags:
      - 'desktop-v*'

jobs:
  # Tag pushes only. Creates the release in the public releases repo (see
  # `publish` below for why it lives there) as a *draft* up front, so each
  # build job can upload its installers straight into it instead of handing
  # them to `publish` as workflow artifacts — artifact uploads count against
  # the org's Actions storage quota, which blocked both the 0.3.2 and the
  # first 0.3.3 run. Drafts are invisible to electron-updater and to the
  # landing page's releases/latest links, so nothing reaches users until
  # `publish` flips it. Skips creation if a draft from an earlier attempt at
  # the same tag is already there, so a re-run picks up where it left off.
  prepare:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo onja-org/hi-day-releases >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, reusing it"
          else
            gh release create "${{ github.ref_name }}" \
              --repo onja-org/hi-day-releases \
              --title "Desktop ${{ github.ref_name }}" \
              --generate-notes \
              --draft
          fi

  build:
    needs: prepare
    # `prepare` is skipped on a manual dispatch, which would otherwise skip
    # this job too.
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist-script: dist:linux
          - os: windows-latest
            dist-script: dist:win
          - os: macos-latest
            dist-script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # dist:win now publishes win-resolver.exe before packaging, so this job
      # needs the SDK too — not just the windows-native job. Pinned to the same
      # 8.0.x that job uses rather than relying on whichever SDK happens to be
      # preinstalled on the runner image.
      - name: Set up .NET
        if: matrix.os == 'windows-latest'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test desktop package
        run: |
          pnpm --filter desktop lint
          pnpm --filter desktop test

      # dist:win now runs `dotnet publish` on the WinResolver side-car
      # itself (see desktop/package.json and electron-builder.yml) —
      # pinned explicitly rather than relying on whatever SDK version
      # windows-latest happens to ship preinstalled, matching the
      # windows-native job below.
      - name: Set up .NET
        if: matrix.os == 'windows-latest'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build installer
        run: pnpm --filter desktop ${{ matrix.dist-script }}

      # The release token is scoped to this one step rather than the job:
      # earlier steps run third-party install scripts (`pnpm install`), and
      # whoever holds this token controls the installers and the latest*.yml
      # sha512s that Windows/Linux clients auto-install from. `--clobber` so a
      # re-run of a failed job replaces whatever it half-uploaded last time.
      - name: Upload installers to draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          shopt -s nullglob
          files=(desktop/release/*.AppImage desktop/release/*.deb desktop/release/*.exe \
                 desktop/release/*.dmg desktop/release/*.zip desktop/release/latest*.yml \
                 desktop/release/*.blockmap)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found in desktop/release" >&2
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${files[@]}" \
            --repo onja-org/hi-day-releases \
            --clobber

      # Manual dispatch only — a tag push uploads to the release above
      # instead.
      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest*.yml
            desktop/release/*.blockmap
          if-no-files-found: error
          # ~770MB per run counts against the org's Actions storage quota,
          # so don't keep it for the default 90 days. A manual dispatch build
          # has to be downloaded within a day.
          retention-days: 1

  # Permanent (not workflow_dispatch-only) because Windows CI needs to
  # build whatever lives under native/win/resolver/ for every release, same
  # as the Electron installer above. The throwaway FlaUI-vs-CsWin32
  # comparison itself lives in the separate windows-native-spike.yml —
  # workflow_dispatch only, since it's a one-time decision, not something
  # every push needs. native/win/fixture-capture/ (a standalone
  # data-collection tool predating the real resolver) was removed once
  # win-resolver.exe's own --capture-fixtures mode made it redundant — see
  # native/win/README.md.
  windows-native:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test win-resolver (Stage C)
        run: dotnet test native/win/resolver/WinResolver.Tests/WinResolver.Tests.csproj -c Release

      - name: Build win-resolver (Stage C)
        # Build only, not publish — packaging (self-contained single-file,
        # electron-builder wiring, code signing) is Stage C.3's job, not
        # C.1's. This just proves the P/Invoke-heavy console app project
        # actually compiles for real, since it can't be verified locally.
        run: dotnet build native/win/resolver/WinResolver/WinResolver.csproj -c Release

  # Only runs for the `desktop-v*` tag push, once every platform in the
  # matrix above has built and uploaded successfully — takes the draft that
  # `prepare` created out of draft, which is the moment it becomes visible.
  # It lives in the separate *public*
  # onja-org/hi-day-releases repo (this source repo is
  # private, and GitHub never serves private-repo release assets to
  # unauthenticated users, so a public download link has to point at a
  # public repo). The landing page links to
  # github.com/<releases-repo>/releases/latest/download/<fixed filename>,
  # which is why electron-builder's artifactName (see
  # desktop/electron-builder.yml) is deliberately version-free: those links
  # never need to change here.
  #
  # The uploads include latest.yml/latest-mac.yml/latest-linux.yml and the
  # NSIS/dmg/zip .blockmap files alongside the installers (see
  # electron-builder.yml's `publish` block) — electron-updater on a running
  # app reads those from this same release to find out there's something
  # newer and verify it before installing.
  #
  # RELEASES_REPO_TOKEN is a fine-grained PAT scoped to just that releases
  # repo with Contents: Read and write — the default GITHUB_TOKEN can't be
  # used here since it only ever has access to the repo the workflow runs in.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo onja-org/hi-day-releases \
            --draft=false \
            --latest
