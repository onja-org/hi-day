name: Desktop build

on:
  workflow_dispatch: {}
  push:
    # Cut a release by tagging e.g. `desktop-v0.2.0` (matching
    # desktop/package.json's version) and pushing the tag — that's the
    # only thing that also runs the publish job below. A plain manual
    # dispatch just builds + tests, useful for checking a branch builds
    # cleanly on all three platforms without cutting a release.
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist-script: dist:linux
          - os: windows-latest
            dist-script: dist:win
          - os: macos-latest
            dist-script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test desktop package
        run: |
          pnpm --filter desktop lint
          pnpm --filter desktop test

      - name: Build installer
        run: pnpm --filter desktop ${{ matrix.dist-script }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

  # Only runs for the `desktop-v*` tag push, once every platform in the
  # matrix above has built successfully — attaches every installer to a
  # GitHub Release in the separate *public* onja-org/workfoce-monitoring-app-releases
  # repo (this source repo is private, and GitHub never serves private-repo
  # release assets to unauthenticated users, so a public download link has
  # to point at a public repo). The landing page links to
  # github.com/<releases-repo>/releases/latest/download/<fixed filename>,
  # which is why electron-builder's artifactName (see
  # desktop/electron-builder.yml) is deliberately version-free: those links
  # never need to change here.
  #
  # RELEASES_REPO_TOKEN is a fine-grained PAT scoped to just that releases
  # repo with Contents: Read and write — the default GITHUB_TOKEN can't be
  # used here since it only ever has access to the repo the workflow runs in.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" installers/* \
            --repo onja-org/workfoce-monitoring-app-releases \
            --title "Desktop ${{ github.ref_name }}" \
            --generate-notes
