name: Windows native spike

# workflow_dispatch only — this is a one-time (or occasional re-check)
# decision spike (Prompt C.0), not something every push needs. The
# permanent Windows native build (native/win/resolver/) is the
# windows-native job in desktop-build.yml instead.
#
# The temporary push-trigger workaround (needed only because a brand-new
# workflow file's workflow_dispatch doesn't become dispatchable until it
# exists on the default branch) has been removed now that real spike
# results are in — see RESULTS.md.
on:
  workflow_dispatch: {}

jobs:
  spike:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # timeout-minutes here: a real run hung for 18+ minutes with zero
      # output making a COM call from the wrong threading apartment (see
      # the [STAThread] fix in each variant's Program.cs). That fix should
      # prevent a repeat, but this bounds any *future* unrelated hang to a
      # known, short wait instead of silently consuming hours of CI time
      # before anyone notices.
      - name: Run FlaUI variant
        timeout-minutes: 10
        run: ./native/win/spike/run-variant.ps1 -VariantPath native/win/spike/flaui-variant/flaui-variant.csproj -VariantName FlaUI

      - name: Run CsWin32 variant
        timeout-minutes: 10
        run: ./native/win/spike/run-variant.ps1 -VariantPath native/win/spike/cswin32-variant/cswin32-variant.csproj -VariantName CsWin32

      - name: Print combined summary
        run: |
          Write-Host "===================================="
          Write-Host "Copy everything below back to Claude"
          Write-Host "===================================="
          Get-Content spike-results/FlaUI.json
          Get-Content spike-results/CsWin32.json
          Get-Content spike-results/*.json | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Upload spike results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-spike-results
          path: spike-results/
          if-no-files-found: warn
