<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>Workforce Monitor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Workforce Monitor</h1>

      <p id="loading-view">Loading…</p>

      <section id="login-view" hidden>
        <form id="login-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="username" />

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
          />

          <button type="submit">Log in</button>
          <p id="login-error" role="alert" hidden></p>
        </form>
      </section>

      <section id="status-view" hidden>
        <p>Logged in as <strong id="status-email"></strong>.</p>

        <div id="tracking-view">
          <p id="tracking-error" role="alert" hidden></p>

          <div id="screen-recording-banner" class="idle-banner" role="alert" hidden>
            <p id="screen-recording-banner-message">
              Window title tracking is off — needs Screen Recording access.
            </p>
            <button id="screen-recording-grant-button" type="button">Grant Access</button>
            <button id="screen-recording-settings-button" type="button">
              Open System Settings
            </button>
          </div>
          <p id="wayland-notice" class="idle-notice" hidden>
            App and window tracking isn't available on this Linux session
            (Wayland) — this can't be fixed from within the app.
          </p>

          <div id="idle-banner" class="idle-banner" role="alert" hidden>
            <p id="idle-banner-message"></p>
            <button id="idle-keep-button" type="button">Keep this time</button>
            <button id="idle-discard-button" type="button">Discard idle time</button>
          </div>
          <p id="idle-notice" class="idle-notice" hidden></p>

          <label for="project-select">Project</label>
          <select id="project-select"></select>

          <label for="task-select">Task (optional)</label>
          <select id="task-select">
            <option value="">No task</option>
          </select>

          <p id="timer-display" class="timer-display" hidden>00:00:00</p>

          <button id="start-button" type="button">Start timer</button>
          <button id="stop-button" type="button" hidden>Stop timer</button>
          <button id="switch-button" type="button" hidden>
            Stop the other timer and start this one
          </button>
        </div>

        <button id="logout-button" type="button">Log out</button>
      </section>
    </main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
