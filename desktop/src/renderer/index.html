<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>Workforce Monitor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Workforce Monitor</h1>

      <div id="update-banner" class="update-banner" role="status" hidden>
        <p id="update-message"></p>
        <button id="update-button" type="button">View update</button>
        <button id="update-dismiss" type="button" aria-label="Dismiss">&times;</button>
      </div>

      <div id="screen-recording-banner" class="idle-banner" role="alert" hidden>
        <p id="screen-recording-banner-message">
          Window title tracking is off — needs Screen Recording access.
        </p>
        <button id="screen-recording-grant-button" type="button">Grant Access</button>
        <button id="screen-recording-settings-button" type="button">
          Open System Settings
        </button>
      </div>

      <p id="loading-view">Loading…</p>

      <section id="login-view" hidden>
        <p id="pairing-status">Sign in from your browser to link this device.</p>
        <p id="pairing-error" role="alert" hidden></p>
        <button id="login-button" type="button">Log in</button>
      </section>

      <section id="status-view" hidden>
        <p id="organisation-name" class="organisation-name"></p>

        <div id="tracking-view">
          <p id="tracking-error" role="alert" hidden></p>

          <!-- Passive, non-blocking disclosure notice (see docs/adr/0015-...)
               — informational only, never gates the timer/tracking below it. -->
          <div id="disclosure-banner" class="idle-banner" role="status" hidden>
            <p id="disclosure-text"></p>
            <p id="disclosure-error" role="alert" hidden></p>
            <button id="disclosure-acknowledge-button" type="button">Got it</button>
          </div>

          <p id="tracking-indicator" class="idle-notice" hidden>Tracking is on</p>

          <div id="idle-banner" class="idle-banner" role="alert" hidden>
            <p id="idle-banner-message"></p>
            <button id="idle-keep-button" type="button">Keep this time</button>
            <button id="idle-discard-button" type="button">Discard idle time</button>
          </div>
          <p id="idle-notice" class="idle-notice" hidden></p>

          <p id="timer-display" class="timer-display" hidden>00:00:00</p>

          <button id="timer-toggle" type="button" class="timer-toggle" aria-label="Start timer">
            <svg viewBox="0 0 256 256" width="32" height="32" aria-hidden="true">
              <path id="timer-toggle-path" d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z" fill="currentColor" />
            </svg>
          </button>

          <ul id="project-list" class="project-list"></ul>

          <label for="task-select">Task (optional)</label>
          <select id="task-select">
            <option value="">No task</option>
          </select>
          <button id="switch-button" type="button" hidden>
            Stop the other timer and start this one
          </button>
        </div>

        <button id="logout-button" type="button">Log out</button>
      </section>
    </main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
