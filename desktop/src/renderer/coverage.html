<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>Website tracking status</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app coverage-app">
      <h1>Website tracking status</h1>
      <p class="coverage-intro">
        What's actually being tracked on this machine, and why, in plain language — not API
        names. If a browser shows anything other than "Active", that's the reason nothing
        (or only partial data) is showing up for it.
      </p>

      <button id="coverage-refresh" type="button">Refresh</button>
      <p id="coverage-loading">Checking…</p>
      <p id="coverage-error" role="alert" hidden></p>

      <table id="coverage-table" hidden>
        <thead>
          <tr>
            <th>Browser</th>
            <th>Status</th>
            <th>Why</th>
          </tr>
        </thead>
        <tbody id="coverage-rows"></tbody>
      </table>

      <section id="coverage-health" hidden>
        <h2>Tracking helper</h2>
        <p id="coverage-health-state"></p>
        <p id="coverage-health-errors"></p>
      </section>
    </main>
    <script type="module" src="coverage-renderer.js"></script>
  </body>
</html>
