appId: org.onja.workforce-monitor
productName: Workforce Monitor
# Deliberately version-free: the landing page links to
# github.com/<repo>/releases/latest/download/<this filename>, a URL GitHub
# keeps pointing at whatever the latest release's matching asset is. If
# ${version} were in the name, every release would need a landing-page
# code change to match.
artifactName: workforce-monitor-${os}-${arch}.${ext}
# Squeezes the installer harder at build time — Electron apps bundle a full
# Chromium + Node runtime, so this won't work miracles (typically 5-15%
# smaller), but it's free size reduction with no functional tradeoff, just
# a slower build.
compression: maximum
directories:
  output: release
# electron-builder 26 still defaults `toolsets.appimage` to "0.0.0", the legacy
# AppImageKit runtime, which dlopen()s libfuse.so.2 at startup. Ubuntu dropped
# libfuse2 from the default install in 23.10 (and 22.04/24.04 users overwhelmingly
# don't have it), so that runtime fails before it can even mount the payload:
#   dlopen(): error loading libfuse.so.2
# "1.0.3" is the AppImage/type2-runtime bundle, which links libfuse3 *statically*
# — nothing to dlopen, nothing for the user to apt-install. Becomes the default
# in electron-builder 27; pinned explicitly here until we're on it.
toolsets:
  appimage: "1.0.3"
# Linux only (see the script itself): wraps the real binary so it always
# launches with --no-sandbox, working around Chromium's sandbox failing to
# start on AppArmor-restricted distros (Ubuntu 23.10+) with no packaged
# AppArmor profile.
afterPack: scripts/afterPack.mjs
files:
  - dist/**/*
  - package.json
# Native addons can't be require()'d from inside an asar archive.
asarUnpack:
  - node_modules/@paymoapp/active-window/**/*
  - node_modules/uiohook-napi/**/*
# Both ship prebuilt native binaries — rebuilding against Electron's headers
# is unnecessary and fails without system X11 dev headers here.
# NOTE: this also skips better-sqlite3, which DOES need an Electron-ABI
# rebuild (it has no prebuilt-per-Electron-version binary the way the two
# packages above do) — that's why every dist:* script runs `rebuild:electron`
# first. Without that step this silently ships better-sqlite3 built for
# plain Node's ABI, which throws a NODE_MODULE_VERSION mismatch inside
# UrlCaptureService's synchronous construction — before the main window is
# ever created — so the packaged app never opens a window at all.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.productivity
  identity: null

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  executableName: workforce-monitor
  # The legacy AppImage toolset appended --no-sandbox to the generated desktop
  # entry's Exec line on its own; the static runtime (see toolsets above) doesn't.
  # scripts/afterPack.mjs's wrapper already forces the flag at exec() time, so
  # this is belt-and-braces — but it keeps the .desktop launchers self-describing
  # rather than relying on the wrapper alone.
  executableArgs: ["--no-sandbox"]

deb:
  packageName: workforce-monitor

# No code signing yet — see README.md. Skip publishing/auto-update wiring
# entirely for this pass.
publish: null
