appId: io.hiday.app
productName: Hi Day
# Deliberately version-free: the landing page links to
# github.com/<repo>/releases/latest/download/<this filename>, a URL GitHub
# keeps pointing at whatever the latest release's matching asset is. If
# ${version} were in the name, every release would need a landing-page
# code change to match.
artifactName: hiday-${os}-${arch}.${ext}
# Squeezes the installer harder at build time — Electron apps bundle a full
# Chromium + Node runtime, so this won't work miracles (typically 5-15%
# smaller), but it's free size reduction with no functional tradeoff, just
# a slower build.
compression: maximum
# Writes the macOS Info.plist entry and the Linux .desktop MimeType
# (x-scheme-handler/hiday). NSIS reads nothing from this, so Windows is
# registered at runtime by main.ts's registerDeepLinkScheme.
protocols:
  - name: Hi Day
    schemes:
      - hiday
directories:
  output: release
# App icon (source: build/icon.svg — see README "App icon" for how the PNG
# and ICO are regenerated). The PNG is 1024px with macOS-style padding;
# electron-builder converts it to .icns for macOS and uses it as-is for
# Linux. Windows gets its own multi-size .ico (full-bleed, so it stays
# legible at 16px in the taskbar).
icon: build/icon.png
# electron-builder 26 still defaults `toolsets.appimage` to "0.0.0", the legacy
# AppImageKit runtime, which dlopen()s libfuse.so.2 at startup. Ubuntu dropped
# libfuse2 from the default install in 23.10 (and 22.04/24.04 users overwhelmingly
# don't have it), so that runtime fails before it can even mount the payload:
#   dlopen(): error loading libfuse.so.2
# "1.0.3" is the AppImage/type2-runtime bundle, which links libfuse3 *statically*
# — nothing to dlopen, nothing for the user to apt-install. Becomes the default
# in electron-builder 27; pinned explicitly here until we're on it.
toolsets:
  appimage: "1.0.3"
# Linux only (see the script itself): wraps the real binary so it always
# launches with --no-sandbox, working around Chromium's sandbox failing to
# start on AppArmor-restricted distros (Ubuntu 23.10+) with no packaged
# AppArmor profile.
# Refuses to package when the platform's resolver side-car is missing, rather
# than shipping an installer whose URL tracking cannot start.
beforePack: scripts/beforePack.mjs
afterPack: scripts/afterPack.mjs
files:
  - dist/**/*
  - package.json
# Native addons can't be require()'d from inside an asar archive.
asarUnpack:
  - node_modules/@paymoapp/active-window/**/*
  - node_modules/uiohook-napi/**/*
# Both ship prebuilt native binaries — rebuilding against Electron's headers
# is unnecessary and fails without system X11 dev headers here.
# NOTE: this also skips better-sqlite3, which DOES need an Electron-ABI
# rebuild (it has no prebuilt-per-Electron-version binary the way the two
# packages above do) — that's why every dist:* script runs `rebuild:electron`
# first. Without that step this silently ships better-sqlite3 built for
# plain Node's ABI, which throws a NODE_MODULE_VERSION mismatch inside
# UrlCaptureService's synchronous construction — before the main window is
# ever created — so the packaged app never opens a window at all.
npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # The published self-contained win-resolver.exe plus the browser-registry/
  # firefox-private-markers JSON files copied alongside it (see
  # WinResolver.csproj's linked-file <None> entries) — NOT the AOT/trimmed
  # variants ruled out by native/win/spike/RESULTS.md. `pnpm dist:win` now
  # runs the `dotnet publish` step itself before calling electron-builder
  # (see desktop/package.json) — don't run electron-builder directly, it
  # won't produce this output on its own. Resolved at runtime via
  # process.resourcesPath, per resolvers/win32/resolver-path.ts and
  # CLAUDE.md's side-car convention — wired into main.ts's
  # resolverSpawnConfigForPlatform, still unverified against a real Windows
  # machine.
  #
  # `from` is one level up (../) because native/win/ lives at the repo
  # root, not under desktop/ — electron-builder resolves extraResources
  # paths relative to *this* project's directory (desktop/). The
  # unprefixed path used to point at a desktop/native/win/ that never
  # existed, so it silently matched nothing (no error, no copy): every
  # Windows installer built before this fix shipped without
  # WinResolver.exe at all, i.e. with no browser-address-bar URL tracking
  # on Windows — confirmed from CI's dist:win logs, which show no copy and
  # no failure for the missing source.
  extraResources:
    # ../ because the Windows resolver lives at the REPO ROOT, while the
    # darwin helper lives under desktop/ — extraResources resolves `from`
    # against desktop/, so the two are not symmetrical.
    - from: ../native/win/resolver/WinResolver/bin/Release/net8.0-windows/win-x64/publish
      to: native/win/resolver
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.productivity
  # Still no real Developer ID certificate (see README's "Known
  # limitations"), so "-" ad-hoc signs instead: a signature with no
  # publisher behind it. `null` skipped signing entirely, and an unsigned
  # build doesn't open at all on Apple Silicon — packaging edits the
  # bundle, invalidating the signature Electron's binaries ship with, and
  # macOS calls the app "damaged" with no way to open it anyway. Ad-hoc
  # signed, it opens after the one-time Gatekeeper step in the README's
  # "Opening a test build on macOS". Hardened runtime stays on: the
  # entitlements' disable-library-validation is what lets an ad-hoc app
  # load Electron's frameworks and the native addons. Swap this for the
  # real identity when Step 27's signing/notarization lands.
  identity: "-"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Shown verbatim in the Automation consent prompt — plain language,
    # not API names (Prompt B.3 point 4).
    NSAppleEventsUsageDescription: >-
      Hi Day reads the address bar of your browser windows while
      a timer is running, so your time entries can include which websites
      you were working on. It never controls your browser or changes
      anything in it.
  # The compiled universal firefox-ax-helper binary (see
  # native/darwin/firefox-ax-helper-swift/build.sh) — `pnpm dist:mac` now
  # runs that build itself before calling electron-builder (see
  # desktop/package.json), so don't run electron-builder directly, it
  # won't produce this output on its own. Same class of bug as the Windows
  # resolver above: this path was already correct (source lives under
  # desktop/native/darwin/), but CI never ran build.sh first, so every
  # macOS installer built before this fix silently shipped without this
  # helper too. Resolved at runtime via process.resourcesPath, per
  # CLAUDE.md's side-car convention.
  extraResources:
    - from: native/darwin/firefox-ax-helper
      to: native/darwin/firefox-ax-helper

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  executableName: hiday
  # A directory of NxN.png files, installed as hicolor/NxN/apps/hiday.png.
  # Don't fall back to the top-level 1024px icon here: the hicolor theme
  # index tops out at 512x512, so GNOME can't find a 1024x1024 entry and
  # shows the generic gear icon for the launcher/app grid.
  icon: build/icons
  # The legacy AppImage toolset appended --no-sandbox to the generated desktop
  # entry's Exec line on its own; the static runtime (see toolsets above) doesn't.
  # scripts/afterPack.mjs's wrapper already forces the flag at exec() time, so
  # this is belt-and-braces — but it keeps the .desktop launchers self-describing
  # rather than relying on the wrapper alone.
  executableArgs: ["--no-sandbox"]

deb:
  packageName: hiday
  # electron-builder's own after-install minus the AppArmor profile it
  # generates — that profile's label is what stops a snap-confined browser
  # sending us its accessibility events. See the script for the measurements.
  afterInstall: build/afterInstall.sh
  # Removes the browser launcher overrides browser-activation.ts wrote. They
  # live under each user's home and outlive the package, so without this every
  # browser keeps starting with accessibility forced on after uninstall.
  afterRemove: build/afterRemove.sh

# Points electron-updater at the same public releases repo update-checker.ts
# already reads from (see RELEASES_REPO there) — this is what makes
# electron-builder emit latest.yml/latest-mac.yml/latest-linux.yml (and the
# NSIS/AppImage .blockmap files) into `directories.output` alongside the
# installers, which is how auto-updater.ts's electron-updater instance knows
# what "latest" means and how to verify a downloaded update's sha512 before
# ever applying it.
#
# `--publish never` is passed explicitly by every `dist:*` script (see
# package.json) so this config only ever generates those files locally —
# it never tries to upload/publish itself. The actual GitHub release upload
# stays a separate CI step (desktop-build.yml's `publish` job, using
# RELEASES_REPO_TOKEN), which now also needs to pick up the .yml/.blockmap
# files alongside the installers, not just the installers themselves.
#
# Still only really exercised on Windows/Linux today — macOS auto-update
# needs a valid code signature to apply at all (see README's Known
# limitations and auto-updater.ts's supportsSilentAutoUpdate), so this repo
# being unsigned means mac keeps using the manual "View update" banner. The
# `zip` mac target above is kept regardless, since Squirrel.Mac needs it
# (not the dmg) once signing lands.
publish:
  provider: github
  owner: onja-org
  repo: workfoce-monitoring-app-releases
